[package]
name = "hust-course-hack-gui"
version = "0.2.0"
description = "Desktop GUI for the HUST SmartCourse crawler"
edition = "2024"

[lib]
name = "hust_course_hack_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
env_logger = "0.11"
hust-course-hack = { path = ".." }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
url = "2"
