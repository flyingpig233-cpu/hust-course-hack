name: CI

# 每次推到 main / PR 都跑：Rust 格式化 + clippy + 测试、前端与网站构建、
# Windows 上 GUI crate 的 clippy。安装包与 Release 不在这里，见 release.yml。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust · fmt / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      # 不能用 `cargo clippy --workspace`：src-tauri 链接 WebKitGTK，
      # Linux 上还需要一串系统库。GUI crate 的 lint 在下面的 desktop job 里跑。
      - name: cargo clippy (core + server)
        run: cargo clippy -p hust-course-hack -p hust-course-web --all-targets -- -D warnings

      - name: cargo test (core + server)
        run: cargo test -p hust-course-hack -p hust-course-web

  frontend:
    name: Frontend · ui / website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install desktop UI dependencies
        run: npm ci

      # `npm run build` = tsc --noEmit && vite build -> ui/dist（Tauri 的 frontendDist）
      - name: Type-check + build desktop UI
        run: npm run build

      # 网页版走 `--mode web`；VITE_BACKEND 在 CI 里显式给，不依赖 ui/.env.web
      - name: Type-check + build web bundle
        run: npm run build:web
        env:
          VITE_BACKEND: web

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Website tests
        working-directory: website
        run: npm test

      - name: Website build
        working-directory: website
        run: npm run build

  desktop:
    name: Desktop · Windows clippy
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install UI dependencies
        run: npm ci

      # `tauri::generate_context!()` 在编译期嵌入 frontendDist（ui/dist），
      # 所以 lint GUI crate 之前必须先构建前端。
      - name: Build the UI
        run: npm run build

      - name: cargo clippy (GUI)
        run: cargo clippy -p hust-course-hack-gui --all-targets -- -D warnings
